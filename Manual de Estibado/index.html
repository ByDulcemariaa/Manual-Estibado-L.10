<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manual de Estibados</title>
  <style>
    /* Reset y estilos básicos */
    body, html {
      margin: 0; padding: 0;
      height: 100%; background: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    #content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      margin: 0 0 1rem 0;
    }
    #viewer {
      position: relative;
      flex: 1;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      overflow: hidden; /* recorta todo lo que desborde */
    }
    .watermark {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      z-index: 10;
    }
    .watermark span {
      transform: rotate(-45deg);
      font-size: 5rem;
      color: rgba(255,0,0,0.3);
      margin: 2rem;
      white-space: nowrap;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    p.note {
      text-align: center;
      margin: 0.5rem 0 0;
      color: #555;
    }
  </style>
  <script>
    // 1) Bloqueo de clic derecho
    document.addEventListener('contextmenu', e => e.preventDefault());
    // 2) Bloqueo de atajos Ctrl+S, Ctrl+P y PrintScreen
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && (e.key==='s' || e.key==='p')) || e.key==='PrintScreen') {
        e.preventDefault();
      }
    });
    // 3) Temporizador: 1m30s = 90000ms
    setTimeout(() => {
      document.getElementById('viewer').innerHTML =
        '<h2 style="text-align:center;margin-top:2rem;">Sesión expirada</h2>' +
        '<p style="text-align:center;">El acceso ha finalizado.</p>';
    }, 90000);
  </script>
</head>
<body>
  <div id="content">
    <h1>Manual de Estibados</h1>

    <!-- Contenedor del visor PDF + watermark -->
    <div id="viewer">
      <div class="watermark">
        <span>CONFIDENCIAL</span>
        <span>EMSULA</span>
        <span>ACCESO RESTRINGIDO</span>
        <span>PROPIEDAD PROTEGIDA</span>
      </div>
      <iframe src="manual.pdf#toolbar=0&amp;navpanes=0"></iframe>
    </div>

    <p class="note">Nota: descargas y capturas deshabilitadas.</p>
  </div>
</body>
</html>
