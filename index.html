<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Para móvil: ancho del dispositivo y escala inicial -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual de Estibados</title>
  <style>
    /* Reset completo y contenedor principal */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    #viewer {
      position: relative;
      width: 100%; height: 100%;
      background: #fff;
      overflow: hidden; /* oculta scroll de la página */
    }

    /* Estilos iframe */
    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Watermark centrado y a escala */
    .watermark {
      position: absolute;
      top: 50%; left: 50%;
      width: 200%; height: 200%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: flex; flex-wrap: wrap;
      align-content: center; justify-content: center;
      z-index: 10;
    }
    .watermark span {
      transform: rotate(-45deg);
      font-size: 8vw;              /* Se adapta al ancho de pantalla */
      color: rgba(255,0,0,0.2);    /* opacidad ligera */
      margin: 5%;
      white-space: nowrap;
    }

    /* Mensaje al expirar */
    #expired {
      position: absolute;
      top:0; left:0;
      width:100%; height:100%;
      background:#fff;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:2rem;
      font-size:1.2rem;
      z-index:20;
      display:none;
    }
  </style>
  <script>
    // 1) Bloqueo de clic derecho
    document.addEventListener('contextmenu', e => e.preventDefault());
    // 2) Bloqueo de atajos Ctrl+S, Ctrl+P, PrintScreen
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && (e.key==='s' || e.key==='p')) || e.key==='PrintScreen') {
        e.preventDefault();
      }
    });
    // 3) Temporizador de 1 min 30 s (90 000 ms)
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('viewer').style.display = 'none';
        document.getElementById('expired').style.display = 'flex';
      }, 90000);
    });
  </script>
</head>
<body>

  <!-- Contenedor donde se mostrará el PDF -->
  <div id="viewer">
    <!-- Marca de agua -->
    <div class="watermark">
      <span>CONFIDENCIAL EMSULA</span>
      <span>ACCESO RESTRINGIDO</span>
      <span>PROPIEDAD PROTEGIDA</span>
    </div>
    <!-- PDF sin barra de herramientas -->
    <iframe src="manual.pdf#toolbar=0&amp;navpanes=0"></iframe>
  </div>

  <!-- Mensaje al expirar -->
  <div id="expired">
    <h1>Sesión expirada</h1>
    <p>El acceso ha finalizado.</p>
  </div>

</body>
</html>
